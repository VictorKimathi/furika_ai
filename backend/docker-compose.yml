services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: furika
      POSTGRES_USER: furika
      POSTGRES_PASSWORD: furika
    ports:
      - "5432:5432"
    volumes:
      - furika_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furika -d furika"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  furika_postgres_data:

